services:
  study-agent:
    build: .
    restart: unless-stopped
    environment:
      COPILOT_BRIDGE_URL: ${COPILOT_BRIDGE_URL:-http://host.docker.internal:18787}
      COPILOT_BRIDGE_API_KEY: ${COPILOT_BRIDGE_API_KEY:-}
      STUDY_AGENT_MODEL: ${STUDY_AGENT_MODEL:-gpt-5.6-sol}
      STUDY_AGENT_HOST: 0.0.0.0
      STUDY_AGENT_PORT: 8765
      STUDY_AGENT_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - study-agent-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  study-agent-data:
    name: study-agent-data
